<!-- Background: a 160x103 canvas, blurred in its own pixels; CSS only stretches it. -->
<div class="bg" aria-hidden="true">
  <canvas class="bg-canvas" id="bg" width="160" height="103"></canvas>
</div>
<div class="dim" aria-hidden="true"></div>

<main class="stage">
  <section class="card" aria-labelledby="wordmark">
    <div class="status">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-label">COMING SOON</span>
    </div>

    <h1 class="wordmark" id="wordmark">LLMPONG<span class="wordmark-tld">.com</span></h1>

    <div class="divider" aria-hidden="true"></div>

    <p class="pitch">Play Pong against a bot that learns from you. A language model on a home server studies how you play and retunes your opponent.</p>

    <form class="waitlist" id="waitlist">
      <input class="waitlist-input" id="email" name="email" type="email" required
             placeholder="you@example.com" aria-label="Email address" autocomplete="email">
      <button class="waitlist-button" id="notify" type="submit">NOTIFY ME</button>
    </form>
    <p class="note" id="note" aria-live="polite">ONE EMAIL WHEN INFERENCE GOES LIVE · NO SPAM</p>
  </section>
</main>

<footer class="footer">
