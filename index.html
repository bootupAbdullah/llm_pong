<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Pong — Phase 1</title>
<style>
  :root {
    --grid-line: rgba(64, 145, 220, 0.4);
    --grid-bg: #ffffff;
    --window-border: #26415c;
    --ink: #1c2e40;
    --accent: #2f6fb0;
    --grid-line-soft: rgba(64, 145, 220, 0.22);
  }

  /* Alternate color palettes -- same blueprint concept, different hue.
     Each keeps the default palette's saturation/lightness structure,
     just rotated to a different hue, so none of them read as more
     "finished" than the others. --grid-bg stays white in every palette;
     only the ink/line/accent hue changes. */
  :root[data-theme="yellow"] {
    --grid-line: rgba(217, 180, 69, 0.4);
    --grid-line-soft: rgba(217, 180, 69, 0.22);
    --window-border: #5a4d26;
    --ink: #433a1e;
    --accent: #b09030;
  }

  :root[data-theme="green"] {
    --grid-line: rgba(69, 217, 130, 0.4);
    --grid-line-soft: rgba(69, 217, 130, 0.22);
    --window-border: #265a3b;
    --ink: #1e432d;
    --accent: #30b066;
  }

  :root[data-theme="violet"] {
    --grid-line: rgba(130, 69, 217, 0.4);
    --grid-line-soft: rgba(130, 69, 217, 0.22);
    --window-border: #3b265a;
    --ink: #2d1e43;
    --accent: #6630b0;
  }

  * { box-sizing: border-box; }

  /* Text size: everything on the page is sized in rem, so scaling the
     root font-size scales all of it together -- no need to touch each
     rule individually. Kept modest so text doesn't overflow the
     fixed-width boxes (mode-picker cards, settings panel, etc.). */
  html[data-text-size="large"] { font-size: 114%; }
  html[data-text-size="xlarge"] { font-size: 128%; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: var(--grid-bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: "Courier New", Consolas, monospace;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 32px 16px;
  }

  .wordmark {
    position: fixed;
    top: 24px;
    left: 32px;
    font-size: 3.1rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--ink);
    white-space: nowrap;
  }

  .wordmark .tld {
    color: var(--accent);
  }

  .social-links {
    position: fixed;
    bottom: 22px;
    right: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .social-links a {
    display: flex;
    color: var(--ink);
    opacity: 0.7;
    transition: opacity 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }

  .social-links a:hover {
    opacity: 1;
    color: var(--accent);
    transform: translateY(-2px);
  }

  .social-links svg {
    width: 22px;
    height: 22px;
  }

  .social-links img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    border-radius: 3px;
  }

  .settings-trigger {
    position: fixed;
    top: 24px;
    right: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1.5px solid var(--window-border);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  .settings-trigger:hover {
    background: rgba(38, 65, 92, 0.08);
  }

  .settings-trigger svg {
    width: 18px;
    height: 18px;
  }

  .settings-panel {
    position: fixed;
    top: 64px;
    right: 32px;
    display: none;
    flex-direction: column;
    gap: 4px;
    padding: 10px;
    border: 1.5px solid var(--window-border);
    background: #fff;
    min-width: 130px;
  }

  .settings-panel.open {
    display: flex;
  }

  .settings-panel-label {
    font-size: 0.64rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.6;
    margin-bottom: 2px;
  }

  .theme-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border: 1px solid transparent;
    background: transparent;
    font-family: inherit;
    font-size: 0.74rem;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }

  .theme-option:hover {
    background: rgba(38, 65, 92, 0.06);
  }

  .theme-option.active {
    border-color: var(--window-border);
  }

  .theme-swatch {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.15);
    flex-shrink: 0;
  }

  .settings-divider {
    height: 1px;
    background: rgba(38, 65, 92, 0.15);
    margin: 6px 0;
  }

  .text-size-row {
    display: flex;
    gap: 6px;
  }

  .text-size-option {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 0;
    border: 1px solid var(--window-border);
    background: transparent;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
    line-height: 1;
  }

  .text-size-option:hover {
    background: rgba(38, 65, 92, 0.06);
  }

  .text-size-option.active {
    background: var(--window-border);
    color: var(--grid-bg);
  }

  .text-size-option[data-size="normal"] { font-size: 0.7rem; }
  .text-size-option[data-size="large"] { font-size: 0.9rem; }
  .text-size-option[data-size="xlarge"] { font-size: 1.1rem; }

  .controls-bar {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .side-select {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .side-select span {
    font-size: 0.78rem;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .side-btn {
    font-family: inherit;
    font-size: 0.8rem;
    padding: 6px 12px;
    border: 1.5px solid var(--window-border);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    letter-spacing: 0.04em;
  }

  .pause-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
    margin-left: 4px;
  }

  .pause-btn:hover {
    background: rgba(38, 65, 92, 0.08);
  }

  .side-btn.active {
    background: var(--window-border);
    color: var(--grid-bg);
  }

  .scoreboard-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .scoreboard {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 24px;
    border: 1.5px solid var(--window-border);
    background: rgba(38, 65, 92, 0.03);
  }

  .score-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 56px;
  }

  .score-name {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.65;
  }

  .score-value {
    font-size: 1.7rem;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
  }

  .score-sep {
    width: 1px;
    height: 28px;
    background: rgba(38, 65, 92, 0.25);
  }

  .win-note {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.55;
  }

  .game-row {
    display: flex;
    align-items: flex-start;
    gap: 20px;
  }

  .slider-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    /* matches .game-window's rendered height (500px canvas + 6px border
       on each side) so the slider centers against the canvas alone, not
       the taller column below it (footer + control-mode picker) */
    height: 512px;
    order: 0;
  }

  .slider-block .label {
    font-size: 0.7rem;
    opacity: 0.7;
    text-transform: uppercase;
  }

  .vertical-slider {
    writing-mode: vertical-lr;
    direction: rtl;
    appearance: slider-vertical;
    -webkit-appearance: slider-vertical;
    width: 28px;
    height: 420px;
    accent-color: var(--accent);
  }

  .vertical-slider:disabled {
    opacity: 0.32;
    cursor: not-allowed;
  }

  .game-column {
    display: inline-flex;
    flex-direction: column;
    order: 1;
  }

  .game-window {
    position: relative;
    border: 6px solid var(--window-border);
    background: #000;
    line-height: 0;
    -webkit-user-select: none;
    user-select: none;
  }

  .game-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }

  canvas {
    display: block;
    background: #000;
    user-select: none;
  }

  canvas.drag-active {
    cursor: ns-resize;
  }

  .paused-text {
    font-size: 2.1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #fff;
    animation: pulse-size 1.8s ease-in-out infinite;
  }

  @keyframes pulse-size {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }

  .control-mode-section {
    margin-top: 20px;
  }

  .control-mode-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.6;
    text-align: center;
    margin-bottom: 12px;
  }

  .mode-picker {
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  /* Keyboard-sensitivity slider: only meaningful in keyboard control mode, but
     its space is reserved in every mode (min-height) so switching modes doesn't
     shift the canvas. It just fades out when it isn't the active mode. */
  .key-sensitivity {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
    min-height: 26px;
    transition: opacity 0.15s ease;
  }

  .key-sensitivity.inactive {
    opacity: 0;
    visibility: hidden;
  }

  .key-sensitivity-label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.6;
  }

  .key-sensitivity-slider {
    width: 132px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .mode-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 108px;
    padding: 14px 8px 12px;
    border-radius: 16px;
    border: 1.5px solid var(--window-border);
    background: #fff;
    color: var(--ink);
    font-family: inherit;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .mode-card:hover:not(.active) {
    background: rgba(38, 65, 92, 0.06);
  }

  .mode-card.active {
    border-color: var(--accent);
    border-width: 2px;
    transform: scale(1.04);
  }

  .mode-card.active::after {
    content: "";
    position: absolute;
    top: -5px;
    right: -5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }

  .icon-badge {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    border: 1px solid rgba(38, 65, 92, 0.18);
    background-color: rgba(38, 65, 92, 0.04);
    background-image:
      linear-gradient(var(--grid-line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-soft) 1px, transparent 1px);
    background-size: 8px 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }

  .mode-card.active .icon-badge {
    border-color: rgba(47, 111, 176, 0.35);
    background-color: rgba(47, 111, 176, 0.08);
    color: var(--accent);
  }

  .mode-card .mode-label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
  }

  .slider-thumb {
    animation: slide-thumb 2.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes slide-thumb {
    0%, 100% { transform: translateY(-7px); }
    50% { transform: translateY(7px); }
  }

  .drag-cursor {
    animation: bob-cursor 1.8s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes bob-cursor {
    0%, 100% { transform: translateY(-4px); }
    50% { transform: translateY(4px); }
  }

  .key-up {
    animation: press-pulse 2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .key-down {
    animation: press-pulse 2s ease-in-out infinite;
    animation-delay: 1s;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes press-pulse {
    0%, 40%, 100% { opacity: 0.35; }
    15% { opacity: 1; }
  }

  .game-over-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(0, 0, 0, 0.72);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease;
  }

  .game-over-overlay.visible {
    opacity: 1;
    visibility: visible;
  }

  .status-line {
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    text-align: center;
    color: #fff;
  }

  .restart-btn {
    font-family: inherit;
    font-size: 0.8rem;
    padding: 6px 14px;
    border: 1.5px solid #fff;
    background: transparent;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>

    const left = { y: H / 2 - PADDLE_H / 2, prevY: H / 2 - PADDLE_H / 2 };
    const right = { y: H / 2 - PADDLE_H / 2, prevY: H / 2 - PADDLE_H / 2 };
    const score = { left: 0, right: 0 };
    const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: BALL_R };
    let running = true;
    let lastTime = null;
    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }
    function serveBall(directionTowards) {
      const angle = Math.random() * 0.6 - 0.3;
      const dir = directionTowards === "left" ? -1 : 1;
      ball.x = W / 2;
      ball.y = H / 2;
      ball.vx = Math.cos(angle) * BALL_BASE_SPEED * dir;
      ball.vy = Math.sin(angle) * BALL_BASE_SPEED;
      onServe(directionTowards, playerSide, controlMode);
    }
    function resetGame() {
      score.left = 0;
      score.right = 0;
      left.y = right.y = H / 2 - PADDLE_H / 2;
      left.prevY = left.y;
      right.prevY = right.y;
      updateScoreLabels();
      statusLine.textContent = "";
      gameOverOverlay.classList.remove("visible");
      paused = false;
      pauseOverlay.classList.remove("visible");
      pauseBtn.innerHTML = PAUSE_ICON;
      pauseBtn.setAttribute("aria-label", "Pause");
      running = true;
      onGameStart(playerSide);
      serveBall(Math.random() < 0.5 ? "left" : "right");
      lastTime = null;
      requestAnimationFrame(loop);
    }
    function setPaused(next) {
      paused = next;
      pauseOverlay.classList.toggle("visible", paused);
      pauseBtn.innerHTML = paused ? PLAY_ICON : PAUSE_ICON;
      pauseBtn.setAttribute("aria-label", paused ? "Resume" : "Pause");
      if (!paused) {
        lastTime = null;
        requestAnimationFrame(loop);
      }
    }
    function togglePause() {
      if (!running) return;
      setPaused(!paused);
    }
    function updateScoreLabels() {
      leftScoreName.textContent = playerSide === "left" ? "You" : "Bot";
      rightScoreName.textContent = playerSide === "right" ? "You" : "Bot";
      leftScoreValue.textContent = String(score.left);
      rightScoreValue.textContent = String(score.right);
    }
    function setSide(side) {
      playerSide = side;
      btnLeft.classList.toggle("active", side === "left");
      btnRight.classList.toggle("active", side === "right");
      gameRow.style.flexDirection = side === "left" ? "row" : "row-reverse";
      updateScoreLabels();
      onSideChange(side);
    }
    btnLeft.addEventListener("click", () => setSide("left"));
    btnRight.addEventListener("click", () => setSide("right"));
    restartBtn.addEventListener("click", resetGame);
    pauseBtn.addEventListener("click", togglePause);
    gameWindow.addEventListener("dblclick", (e) => {
      e.preventDefault();
      togglePause();
    });
    function setControlMode(mode) {
      controlMode = mode;
      modeButtons.forEach(
        (btn) => btn.classList.toggle("active", btn.dataset.mode === mode)
      );
      slider.disabled = mode !== "slider";
      canvas.classList.toggle("drag-active", mode === "drag");
      keySensitivity.classList.toggle("inactive", mode !== "keyboard");
      if (mode !== "drag") isDragging = false;
      if (mode !== "keyboard") {
        keysHeld.up = false;
        keysHeld.down = false;
      }
    }
    modeButtons.forEach(
      (btn) => btn.addEventListener(
        "click",
        () => setControlMode(btn.dataset.mode)
      )
    );
    keySensitivitySlider.max = String(KEY_SPEED_NOTCHES.length - 1);
    keySensitivitySlider.value = String(getKeySpeedNotch());
    function syncKeySensitivitySlider() {
      keySensitivitySlider.value = String(getKeySpeedNotch());
    }
    keySensitivitySlider.addEventListener("input", () => {
      setKeySpeedNotch(Number(keySensitivitySlider.value));
    });
    window.addEventListener("keydown", (e) => {
      if (controlMode !== "keyboard") return;
      if (e.code === "ArrowLeft") {
        setKeySpeedNotch(getKeySpeedNotch() - 1);
        syncKeySensitivitySlider();
        e.preventDefault();
      } else if (e.code === "ArrowRight") {
        setKeySpeedNotch(getKeySpeedNotch() + 1);
        syncKeySensitivitySlider();
        e.preventDefault();
      }
    });
    function canvasYToPaddleY(clientY) {
      const rect = canvas.getBoundingClientRect();
      const scale = H / rect.height;
      const y = (clientY - rect.top) * scale;
      return clamp(y - PADDLE_H / 2, 0, H - PADDLE_H);
    }
    function dragTo(clientY) {
      const paddle = playerSide === "left" ? left : right;
      paddle.y = canvasYToPaddleY(clientY);
    }
    canvas.addEventListener("mousedown", (e) => {
      if (controlMode !== "drag") return;
      isDragging = true;
      dragTo(e.clientY);
    });
    window.addEventListener("mousemove", (e) => {
      if (controlMode !== "drag" || !isDragging) return;
      dragTo(e.clientY);
    });
    window.addEventListener("mouseup", () => {
      isDragging = false;
    });
    canvas.addEventListener(
      "touchstart",
      (e) => {
        if (controlMode !== "drag") return;
        isDragging = true;
        dragTo(e.touches[0].clientY);
        e.preventDefault();
      },
      { passive: false }
    );
    window.addEventListener(
      "touchmove",
      (e) => {
        if (controlMode !== "drag" || !isDragging) return;
        dragTo(e.touches[0].clientY);
        e.preventDefault();
      },
      { passive: false }
    );
    window.addEventListener("touchend", () => {
      isDragging = false;
    });
    window.addEventListener("keydown", (e) => {
      if (controlMode !== "keyboard") return;
      if (e.code === "ArrowUp" || e.code === "KeyW") {
        keysHeld.up = true;
        e.preventDefault();
      } else if (e.code === "ArrowDown" || e.code === "KeyS") {
        keysHeld.down = true;
        e.preventDefault();
      }
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowUp" || e.code === "KeyW") keysHeld.up = false;
      else if (e.code === "ArrowDown" || e.code === "KeyS") keysHeld.down = false;
    });
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePause();
      }
    });
    function readSliderPaddleY() {
      const maxY = H - PADDLE_H;
      const frac = Number(slider.value) / 1e3;
      return maxY - frac * maxY;
    }
    function updatePlayerPaddle(dt) {
      const paddle = playerSide === "left" ? left : right;
      paddle.prevY = paddle.y;
      if (controlMode === "slider") {
        paddle.y = readSliderPaddleY();
      } else if (controlMode === "keyboard") {
        const keySpeed = getKeySpeed();
        let dy = 0;
        if (keysHeld.up) dy -= keySpeed * dt;
        if (keysHeld.down) dy += keySpeed * dt;
        paddle.y = clamp(paddle.y + dy, 0, H - PADDLE_H);
      }
    }
    function updateBotPaddle(dt) {
      const bot = playerSide === "left" ? right : left;
      const target = ball.y - PADDLE_H / 2;
      const diff = target - bot.y;
      const maxStep = BOT_MAX_SPEED * dt;
      bot.prevY = bot.y;
      if (Math.abs(diff) <= maxStep) {
        bot.y = target;
      } else {
        bot.y += Math.sign(diff) * maxStep;
      }
      bot.y = clamp(bot.y, 0, H - PADDLE_H);
    }
    function step(dt) {
      updatePlayerPaddle(dt);
      updateBotPaddle(dt);
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      if (ball.y - ball.r < 0) {
        ball.y = ball.r;
        ball.vy *= -1;
        onWallBounce();
      } else if (ball.y + ball.r > H) {
        ball.y = H - ball.r;
        ball.vy *= -1;
        onWallBounce();
      }
      checkPaddleCollision(left, PADDLE_MARGIN, 1);
      checkPaddleCollision(right, W - PADDLE_MARGIN - PADDLE_W, -1);
      if (ball.x + ball.r < 0) {
        awardPoint("right");
      } else if (ball.x - ball.r > W) {
        awardPoint("left");
      }
    }
    function checkPaddleCollision(paddle, paddleX, dirSign) {
      const withinX = dirSign === 1 ? ball.x - ball.r <= paddleX + PADDLE_W && ball.x - ball.r >= paddleX : ball.x + ball.r >= paddleX && ball.x + ball.r <= paddleX + PADDLE_W;
      const movingTowards = dirSign === 1 ? ball.vx < 0 : ball.vx > 0;
      if (!withinX || !movingTowards) return;
      const withinY = ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + PADDLE_H;
      if (!withinY) return;
      const relative = (ball.y - (paddle.y + PADDLE_H / 2)) / (PADDLE_H / 2);
      const bounceAngle = relative * (Math.PI / 3);
      const speed = clamp(
        Math.hypot(ball.vx, ball.vy) + BALL_SPEED_STEP,
        BALL_BASE_SPEED,
        BALL_MAX_SPEED
      );
      ball.vx = Math.cos(bounceAngle) * speed * dirSign;
      ball.vy = Math.sin(bounceAngle) * speed;
      ball.x = dirSign === 1 ? paddleX + PADDLE_W + ball.r : paddleX - ball.r;
      onPaddleHit(dirSign === 1 ? "left" : "right", playerSide, controlMode);
    }
    function awardPoint(side) {
      score[side] += 1;
      updateScoreLabels();
      onPoint(side, playerSide);
      if (score[side] >= WIN_SCORE) {
        endGame(side);
      } else {
        serveBall(side === "left" ? "right" : "left");
      }
    }
    function endGame(winningSide) {
      running = false;
      onGameEnd(winningSide, playerSide, {
        left: score.left,
        right: score.right
      });
      const youWon = winningSide === playerSide;
      statusLine.textContent = youWon ? "You win!" : "Bot wins!";
      gameOverOverlay.classList.add("visible");
    }
    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.setLineDash([6, 10]);
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#fff";
      ctx.fillRect(PADDLE_MARGIN, left.y, PADDLE_W, PADDLE_H);
      ctx.fillRect(W - PADDLE_MARGIN - PADDLE_W, right.y, PADDLE_W, PADDLE_H);
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }
    function loop(timestamp) {
      if (!running || paused) return;
      if (lastTime === null) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1e3, 0.033);
      lastTime = timestamp;
      beginFrame(timestamp, dt);
      step(dt);
      commitFrame({
        ball,
        player: playerSide === "left" ? left : right,
        bot: playerSide === "left" ? right : left,
        playerSide,
        controlMode,
        score: { left: score.left, right: score.right }
      });
      draw();
      requestAnimationFrame(loop);
    }
    setSide("left");
    setControlMode("slider");
    onGameStart(playerSide);
    serveBall(Math.random() < 0.5 ? "left" : "right");
    requestAnimationFrame(loop);
  }

  // src/metrics/debug-panel.ts
  var REFRESH_MS = 100;
  function initDebugPanel() {
    const el = document.createElement("div");
    el.id = "pong-debug-panel";
    el.style.cssText = [
      "position:fixed",
      "bottom:16px",
      "left:16px",
      "z-index:9999",
      'font:11px/1.5 "Courier New",Consolas,monospace',
      "color:#1c2e40",
      "background:rgba(255,255,255,0.93)",
      "border:1px solid #26415c",
      "padding:8px 11px",
      "white-space:pre",
      "pointer-events:none",
      "letter-spacing:0.01em"
    ].join(";");
    document.body.appendChild(el);
    function fmt(n, d = 0) {
      return n.toFixed(d);
    }
    function render() {
      const s = getSnapshot();
      const f = s.lastFrame;
      const lines = [
        "— pong metrics · stage 1 —",
        `frames    ${s.framesBuffered} / ${s.frameCapacity}`,
        `rally     #${s.rallyIndex}    leg #${s.legIndex}`,
        s.currentLeg ? `leg dir   → ${s.currentLeg.towardSide} (${s.currentLeg.towardPlayer ? "player" : "bot"})   walls ${s.currentLeg.wallBounces}` : "leg dir   —",
        `rallies   ${s.ralliesThisGame} this game`,
        `score     L ${s.score.left} : ${s.score.right} R`,
        `games     ${s.gamesSaved} saved`
      ];
      if (f) {
        lines.push(
          "",
          `ball      (${fmt(f.ballX)}, ${fmt(f.ballY)})`,
          `ball v    (${fmt(f.ballVx)}, ${fmt(f.ballVy)})`,
          `paddle Y  player ${fmt(f.playerY)}   bot ${fmt(f.botY)}`,
          `mode      ${f.controlMode}${f.controlMode === "keyboard" ? ` · notch ${f.keySpeedNotch}` : ""}   side ${f.playerSide}`,
          `dt        ${fmt(f.dt * 1e3, 1)} ms`
        );
      }
      el.textContent = lines.join("\n");
    }
    render();
    window.setInterval(render, REFRESH_MS);
  }

  // src/main.ts
  initSettings();
  initGame();
  if (window.location.hash.toLowerCase().includes("debug")) {
    initDebugPanel();
  }
  globalThis.__pongMetrics = recorder_exports;
})();
</script>
</body>
