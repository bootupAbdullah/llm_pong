<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Pong — Phase 1</title>
<style>
  :root {
    --grid-line: rgba(64, 145, 220, 0.4);
    --grid-bg: #ffffff;
    --window-border: #26415c;
    --ink: #1c2e40;
    --accent: #2f6fb0;
    --grid-line-soft: rgba(64, 145, 220, 0.22);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: var(--grid-bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: "Courier New", Consolas, monospace;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 32px 16px;
  }

  h1 {
    margin: 0;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .subtitle {
    margin: -12px 0 0;
    font-size: 0.8rem;
    opacity: 0.75;
  }

  .controls-bar {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .side-select {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .side-select span {
    font-size: 0.78rem;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .side-btn {
    font-family: inherit;
    font-size: 0.8rem;
    padding: 6px 12px;
    border: 1.5px solid var(--window-border);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    letter-spacing: 0.04em;
  }

  .pause-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
    margin-left: 4px;
  }

  .pause-btn:hover {
    background: rgba(38, 65, 92, 0.08);
  }

  .side-btn.active {
    background: var(--window-border);
    color: var(--grid-bg);
  }

  .scoreboard {
    display: flex;
    gap: 20px;
    font-size: 1rem;
    letter-spacing: 0.05em;
  }

  .scoreboard .win-note {
    font-size: 0.72rem;
    opacity: 0.65;
    align-self: center;
  }

  .game-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .slider-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    order: 0;
  }

  .slider-block .label {
    font-size: 0.7rem;
    opacity: 0.7;
    text-transform: uppercase;
  }

  .vertical-slider {
    writing-mode: vertical-lr;
    direction: rtl;
    appearance: slider-vertical;
    -webkit-appearance: slider-vertical;
    width: 28px;
    height: 420px;
    accent-color: var(--accent);
  }

  .vertical-slider:disabled {
    opacity: 0.32;
    cursor: not-allowed;
  }

  .game-column {
    display: inline-flex;
    flex-direction: column;
    order: 1;
  }

  .game-window {
    position: relative;
    border: 6px solid var(--window-border);
    background: #000;
    line-height: 0;
  }

  .game-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }

  canvas {
    display: block;
    background: #000;
    user-select: none;
  }

  canvas.drag-active {
    cursor: ns-resize;
  }

  .paused-text {
    font-size: 2.1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #fff;
    animation: pulse-size 1.8s ease-in-out infinite;
  }

  @keyframes pulse-size {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }

  .control-mode-section {
    margin-top: 20px;
  }

  .control-mode-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.6;
    text-align: center;
    margin-bottom: 12px;
  }

  .mode-picker {
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  .mode-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 108px;
    padding: 14px 8px 12px;
    border-radius: 16px;
    border: 1.5px solid var(--window-border);
    background: #fff;
    color: var(--ink);
    font-family: inherit;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .mode-card:hover:not(.active) {
    background: rgba(38, 65, 92, 0.06);
  }

  .mode-card.active {
    border-color: var(--accent);
    border-width: 2px;
    transform: scale(1.04);
  }

  .mode-card.active::after {
    content: "";
    position: absolute;
    top: -5px;
    right: -5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }

  .icon-badge {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    border: 1px solid rgba(38, 65, 92, 0.18);
    background-color: rgba(38, 65, 92, 0.04);
    background-image:
      linear-gradient(var(--grid-line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-soft) 1px, transparent 1px);
    background-size: 8px 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }

  .mode-card.active .icon-badge {
    border-color: rgba(47, 111, 176, 0.35);
    background-color: rgba(47, 111, 176, 0.08);
    color: var(--accent);
  }

  .mode-card .mode-label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
  }

  .slider-thumb {
    animation: slide-thumb 2.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes slide-thumb {
    0%, 100% { transform: translateY(-7px); }
    50% { transform: translateY(7px); }
  }

  .drag-cursor {
    animation: bob-cursor 1.8s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes bob-cursor {
    0%, 100% { transform: translateY(-4px); }
    50% { transform: translateY(4px); }
  }

  .key-up {
    animation: press-pulse 2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .key-down {
    animation: press-pulse 2s ease-in-out infinite;
    animation-delay: 1s;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes press-pulse {
    0%, 40%, 100% { opacity: 0.35; }
    15% { opacity: 1; }
  }

  .game-over-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(0, 0, 0, 0.72);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease;
  }

  .game-over-overlay.visible {
    opacity: 1;
    visibility: visible;
  }

  .status-line {
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    text-align: center;
    color: #fff;
  }

  .restart-btn {
    font-family: inherit;
    font-size: 0.8rem;
    padding: 6px 14px;
    border: 1.5px solid #fff;
    background: transparent;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="page">
  <h1>LLM Pong</h1>
  <p class="subtitle">Phase 1 — game skeleton</p>

  <div class="controls-bar">
    <div class="scoreboard">
      <span id="leftScoreLabel">You: 0</span>
      <span id="rightScoreLabel">Bot: 0</span>
      <span class="win-note">First to 11</span>
    </div>
  </div>

  <div class="game-row" id="gameRow">
    <div class="slider-block">
      <span class="label">Paddle</span>
      <input type="range" class="vertical-slider" id="paddleSlider" min="0" max="1000" value="500">
    </div>
    <div class="game-column">
      <div class="game-window">
        <canvas id="pongCanvas" width="800" height="500"></canvas>
        <div class="game-over-overlay" id="gameOverOverlay">
          <div class="status-line" id="statusLine"></div>
          <button class="restart-btn" id="restartBtn" type="button">Play Again</button>
        </div>
        <div class="game-over-overlay" id="pauseOverlay">
          <div class="paused-text">Paused</div>
        </div>
      </div>
      <div class="game-footer">
        <div class="side-select">
          <span>Play as:</span>
          <button class="side-btn active" id="btnLeft" type="button">Left</button>
          <button class="side-btn" id="btnRight" type="button">Right</button>
          <button class="side-btn pause-btn" id="pauseBtn" type="button" aria-label="Pause">
            <svg id="pauseIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" rx="1"/>
              <rect x="14" y="4" width="4" height="16" rx="1"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="control-mode-section">
        <div class="control-mode-label">Control mode</div>
        <div class="mode-picker" id="modePicker">
          <button class="mode-card active" id="modeSlider" type="button" data-mode="slider">
            <div class="icon-badge">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <line x1="12" y1="2" x2="12" y2="22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <rect class="slider-thumb" x="7" y="9" width="10" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </div>
            <span class="mode-label">Slider</span>
          </button>
          <button class="mode-card" id="modeDrag" type="button" data-mode="drag">
            <div class="icon-badge">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path class="drag-cursor" d="M5 3.5 L6.4 18.5 L9.3 14.6 L11.8 20 L13.9 19 L11.4 13.7 L16.2 13.4 Z" fill="currentColor"/>
              </svg>
            </div>
            <span class="mode-label">Click &amp; Drag</span>
          </button>
          <button class="mode-card" id="modeKeyboard" type="button" data-mode="keyboard">
            <div class="icon-badge">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect class="key-up" x="2" y="3" width="10" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path class="key-up" d="M4.5 9.3 L7 6.7 L9.5 9.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <rect class="key-down" x="12" y="12" width="10" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path class="key-down" d="M14.5 15.7 L17 18.3 L19.5 15.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg>
            </div>
            <span class="mode-label">Keyboard</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('pongCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const PADDLE_W = 12;
  const PADDLE_H = 80;
  const PADDLE_MARGIN = 20;
  const BALL_R = 8;
  const WIN_SCORE = 11;
  const BOT_MAX_SPEED = 340; // px/sec
  const BALL_BASE_SPEED = 320; // px/sec
  const BALL_SPEED_STEP = 18; // px/sec added per paddle hit
  const BALL_MAX_SPEED = 620;
  const PLAYER_KEY_SPEED = 420; // px/sec, keyboard control mode

  const slider = document.getElementById('paddleSlider');
  const gameRow = document.getElementById('gameRow');
  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');
  const leftScoreLabel = document.getElementById('leftScoreLabel');
  const rightScoreLabel = document.getElementById('rightScoreLabel');
  const statusLine = document.getElementById('statusLine');
  const restartBtn = document.getElementById('restartBtn');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const pauseBtn = document.getElementById('pauseBtn');
  const modeButtons = document.querySelectorAll('.mode-card');

  const PAUSE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
  const PLAY_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4 L20 12 L7 20 Z"/></svg>';

  let playerSide = 'left'; // 'left' or 'right'
  let controlMode = 'slider'; // 'slider' | 'drag' | 'keyboard' — how the player's paddle is driven
  let isDragging = false;
  let paused = false;
  const keysHeld = { up: false, down: false };

  const left = { y: H / 2 - PADDLE_H / 2, prevY: H / 2 - PADDLE_H / 2 };
  const right = { y: H / 2 - PADDLE_H / 2, prevY: H / 2 - PADDLE_H / 2 };
  const score = { left: 0, right: 0 };

  const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: BALL_R };

  let running = true;
  let lastTime = null;

  function serveBall(directionTowards) {
    const angle = (Math.random() * 0.6 - 0.3); // +/- ~17 degrees
    const dir = directionTowards === 'left' ? -1 : 1;
    ball.x = W / 2;
    ball.y = H / 2;
    ball.vx = Math.cos(angle) * BALL_BASE_SPEED * dir;
    ball.vy = Math.sin(angle) * BALL_BASE_SPEED;
  }

  function resetGame() {
    score.left = 0;
    score.right = 0;
    left.y = right.y = H / 2 - PADDLE_H / 2;
    left.prevY = left.y;
    right.prevY = right.y;
    updateScoreLabels();
    statusLine.textContent = '';
    gameOverOverlay.classList.remove('visible');
    paused = false;
    pauseOverlay.classList.remove('visible');
    pauseBtn.innerHTML = PAUSE_ICON;
    pauseBtn.setAttribute('aria-label', 'Pause');
    running = true;
    serveBall(Math.random() < 0.5 ? 'left' : 'right');
    lastTime = null;
    requestAnimationFrame(loop);
  }

  function setPaused(next) {
    paused = next;
    pauseOverlay.classList.toggle('visible', paused);
    pauseBtn.innerHTML = paused ? PLAY_ICON : PAUSE_ICON;
    pauseBtn.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
    if (!paused) {
      // resume fresh rather than let a frozen lastTime produce a huge dt spike
      lastTime = null;
      requestAnimationFrame(loop);
    }
  }

  function togglePause() {
    if (!running) return; // no pausing once the game has been won
    setPaused(!paused);
  }

  function updateScoreLabels() {
    const youLabel = playerSide === 'left' ? 'You' : 'Bot';
    // labels are fixed to physical side (left/right), not to who is "you"
    leftScoreLabel.textContent = (playerSide === 'left' ? 'You' : 'Bot') + ': ' + score.left;
    rightScoreLabel.textContent = (playerSide === 'right' ? 'You' : 'Bot') + ': ' + score.right;
  }

  function setSide(side) {
    playerSide = side;
    btnLeft.classList.toggle('active', side === 'left');
    btnRight.classList.toggle('active', side === 'right');
    // slider sits on the same physical side as the paddle it controls
    gameRow.style.flexDirection = side === 'left' ? 'row' : 'row-reverse';
    updateScoreLabels();
  }

  btnLeft.addEventListener('click', () => setSide('left'));
  btnRight.addEventListener('click', () => setSide('right'));
  restartBtn.addEventListener('click', resetGame);
  pauseBtn.addEventListener('click', togglePause);
  canvas.addEventListener('dblclick', (e) => {
    e.preventDefault();
    togglePause();
  });

  function setControlMode(mode) {
    controlMode = mode;
    modeButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.mode === mode));
    slider.disabled = mode !== 'slider';
    canvas.classList.toggle('drag-active', mode === 'drag');
    // switching away drops any in-progress input for the old mode so it
    // can't keep moving the paddle once it's no longer the active source
    if (mode !== 'drag') isDragging = false;
    if (mode !== 'keyboard') { keysHeld.up = false; keysHeld.down = false; }
  }

  modeButtons.forEach((btn) => btn.addEventListener('click', () => setControlMode(btn.dataset.mode)));

  function canvasYToPaddleY(clientY) {
    const rect = canvas.getBoundingClientRect();
    const scale = H / rect.height;
    const y = (clientY - rect.top) * scale;
    return clamp(y - PADDLE_H / 2, 0, H - PADDLE_H);
  }

  function dragTo(clientY) {
    const paddle = playerSide === 'left' ? left : right;
    paddle.y = canvasYToPaddleY(clientY);
  }

  canvas.addEventListener('mousedown', (e) => {
    if (controlMode !== 'drag') return;
    isDragging = true;
    dragTo(e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    if (controlMode !== 'drag' || !isDragging) return;
    dragTo(e.clientY);
  });
  window.addEventListener('mouseup', () => { isDragging = false; });

  canvas.addEventListener('touchstart', (e) => {
    if (controlMode !== 'drag') return;
    isDragging = true;
    dragTo(e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchmove', (e) => {
    if (controlMode !== 'drag' || !isDragging) return;
    dragTo(e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchend', () => { isDragging = false; });

  window.addEventListener('keydown', (e) => {
    if (controlMode !== 'keyboard') return;
    if (e.code === 'ArrowUp' || e.code === 'KeyW') { keysHeld.up = true; e.preventDefault(); }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') { keysHeld.down = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') keysHeld.up = false;
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') keysHeld.down = false;
  });

  function readSliderPaddleY() {
    // slider value 0..1000, top of slider = 1000 (paddle at top, y=0)
    const maxY = H - PADDLE_H;
    const frac = Number(slider.value) / 1000;
    return maxY - frac * maxY;
  }

  function updatePlayerPaddle(dt) {
    const paddle = playerSide === 'left' ? left : right;
    paddle.prevY = paddle.y;
    // sampled every frame so velocity can later be derived as
    // (paddle.y - paddle.prevY) / dt — not used yet in Phase 1. That holds
    // regardless of control mode: slider/drag set paddle.y directly (position),
    // keyboard integrates a velocity into it — either way this is the one spot
    // per frame where the active paddle's position for this frame is decided.
    if (controlMode === 'slider') {
      paddle.y = readSliderPaddleY();
    } else if (controlMode === 'keyboard') {
      let dy = 0;
      if (keysHeld.up) dy -= PLAYER_KEY_SPEED * dt;
      if (keysHeld.down) dy += PLAYER_KEY_SPEED * dt;
      paddle.y = clamp(paddle.y + dy, 0, H - PADDLE_H);
    }
    // 'drag' mode: paddle.y is already set by the drag handlers above.
  }

  function updateBotPaddle(dt) {
    const bot = playerSide === 'left' ? right : left;
    const target = ball.y - PADDLE_H / 2;
    const diff = target - bot.y;
    const maxStep = BOT_MAX_SPEED * dt;
    bot.prevY = bot.y;
    if (Math.abs(diff) <= maxStep) {
      bot.y = target;
    } else {
      bot.y += Math.sign(diff) * maxStep;
    }
    bot.y = clamp(bot.y, 0, H - PADDLE_H);
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function step(dt) {
    updatePlayerPaddle(dt);
    updateBotPaddle(dt);

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if (ball.y - ball.r < 0) {
      ball.y = ball.r;
      ball.vy *= -1;
    } else if (ball.y + ball.r > H) {
      ball.y = H - ball.r;
      ball.vy *= -1;
    }

    checkPaddleCollision(left, PADDLE_MARGIN, 1);
    checkPaddleCollision(right, W - PADDLE_MARGIN - PADDLE_W, -1);

    if (ball.x + ball.r < 0) {
      awardPoint('right');
    } else if (ball.x - ball.r > W) {
      awardPoint('left');
    }
  }

  function checkPaddleCollision(paddle, paddleX, dirSign) {
    const withinX = dirSign === 1
      ? (ball.x - ball.r <= paddleX + PADDLE_W && ball.x - ball.r >= paddleX)
      : (ball.x + ball.r >= paddleX && ball.x + ball.r <= paddleX + PADDLE_W);
    const movingTowards = dirSign === 1 ? ball.vx < 0 : ball.vx > 0;
    if (!withinX || !movingTowards) return;

    const withinY = ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + PADDLE_H;
    if (!withinY) return;

    const relative = ((ball.y - (paddle.y + PADDLE_H / 2)) / (PADDLE_H / 2));
    const bounceAngle = relative * (Math.PI / 3); // max 60 degrees
    const speed = clamp(Math.hypot(ball.vx, ball.vy) + BALL_SPEED_STEP, BALL_BASE_SPEED, BALL_MAX_SPEED);

    ball.vx = Math.cos(bounceAngle) * speed * dirSign;
    ball.vy = Math.sin(bounceAngle) * speed;
    ball.x = dirSign === 1 ? paddleX + PADDLE_W + ball.r : paddleX - ball.r;
  }

  function awardPoint(side) {
    score[side] += 1;
    updateScoreLabels();
    if (score[side] >= WIN_SCORE) {
      endGame(side);
    } else {
      serveBall(side === 'left' ? 'right' : 'left');
    }
  }

  function endGame(winningSide) {
    running = false;
    const youWon = winningSide === playerSide;
    statusLine.textContent = youWon ? 'You win!' : 'Bot wins!';
    gameOverOverlay.classList.add('visible');
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.setLineDash([6, 10]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#fff';
    ctx.fillRect(PADDLE_MARGIN, left.y, PADDLE_W, PADDLE_H);
    ctx.fillRect(W - PADDLE_MARGIN - PADDLE_W, right.y, PADDLE_W, PADDLE_H);

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop(timestamp) {
    if (!running || paused) return;
    if (lastTime === null) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.033);
    lastTime = timestamp;

    step(dt);
    draw();

    requestAnimationFrame(loop);
  }

  setSide('left');
  setControlMode('slider');
  serveBall(Math.random() < 0.5 ? 'left' : 'right');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
