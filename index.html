<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Pong — Phase 1</title>
<style>
  :root {
    --grid-line: rgba(64, 145, 220, 0.4);
    --grid-bg: #ffffff;
    --window-border: #26415c;
    --ink: #1c2e40;
    --accent: #2f6fb0;
    --grid-line-soft: rgba(64, 145, 220, 0.22);
  }

  /* Alternate color palettes -- same blueprint concept, different hue.
     Each keeps the default palette's saturation/lightness structure,
     just rotated to a different hue, so none of them read as more
     "finished" than the others. --grid-bg stays white in every palette;
     only the ink/line/accent hue changes. */
  :root[data-theme="yellow"] {
    --grid-line: rgba(217, 180, 69, 0.4);
    --grid-line-soft: rgba(217, 180, 69, 0.22);
    --window-border: #5a4d26;
    --ink: #433a1e;
    --accent: #b09030;
  }

  :root[data-theme="green"] {
    --grid-line: rgba(69, 217, 130, 0.4);
    --grid-line-soft: rgba(69, 217, 130, 0.22);
    --window-border: #265a3b;
    --ink: #1e432d;
    --accent: #30b066;
  }

  :root[data-theme="violet"] {
    --grid-line: rgba(130, 69, 217, 0.4);
    --grid-line-soft: rgba(130, 69, 217, 0.22);
    --window-border: #3b265a;
    --ink: #2d1e43;
    --accent: #6630b0;
  }

  * { box-sizing: border-box; }

  /* Text size: everything on the page is sized in rem, so scaling the
     root font-size scales all of it together -- no need to touch each
     rule individually. Kept modest so text doesn't overflow the
     fixed-width boxes (mode-picker cards, settings panel, etc.). */
  html[data-text-size="large"] { font-size: 114%; }
  html[data-text-size="xlarge"] { font-size: 128%; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: var(--grid-bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: "Courier New", Consolas, monospace;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 32px 16px;
  }

  .wordmark {
    position: fixed;
    top: 24px;
    left: 32px;
    font-size: 3.1rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--ink);
    white-space: nowrap;
  }

  .wordmark .tld {
    color: var(--accent);
  }

  .social-links {
    position: fixed;
    bottom: 22px;
    right: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .social-links a {
    display: flex;
    color: var(--ink);
    opacity: 0.7;
    transition: opacity 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }

  .social-links a:hover {
    opacity: 1;
    color: var(--accent);
    transform: translateY(-2px);
  }

  .social-links svg {
    width: 22px;
    height: 22px;
  }

  .social-links img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    border-radius: 3px;
  }

  .settings-trigger,
  .difficulty-trigger {
    position: fixed;
    right: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1.5px solid var(--window-border);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    /* above either panel below, so the two stacked trigger buttons stay
       clickable even while the other's panel is open */
    z-index: 2;
  }

  .settings-trigger {
    top: 24px;
  }

  .difficulty-trigger {
    /* directly under the settings/theme button, same 6px gap the panel
       below uses */
    top: 64px;
  }

  .settings-trigger:hover,
  .difficulty-trigger:hover {
    background: rgba(38, 65, 92, 0.08);
  }

  .settings-trigger svg,
  .difficulty-trigger svg {
    width: 18px;
    height: 18px;
  }

  .settings-panel,
  .difficulty-panel {
    position: fixed;
    /* both panels open from the same spot, below the stacked trigger pair */
    top: 104px;
    right: 32px;
    display: none;
    flex-direction: column;
    gap: 4px;
    padding: 10px;
    border: 1.5px solid var(--window-border);
    background: #fff;
    min-width: 130px;
  }

  .settings-panel.open,
  .difficulty-panel.open {
    display: flex;
  }

  .settings-panel-label {
    font-size: 0.64rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.6;
    margin-bottom: 2px;
  }

  .difficulty-option {
    padding: 5px 6px;
    border: 1px solid transparent;
    background: transparent;
    font-family: inherit;
    font-size: 0.74rem;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }

  .difficulty-option:hover {
    background: rgba(38, 65, 92, 0.06);
  }

  .difficulty-option.active {
    border-color: var(--window-border);
  }

  .theme-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border: 1px solid transparent;
    background: transparent;
    font-family: inherit;
    font-size: 0.74rem;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }

  .theme-option:hover {
    background: rgba(38, 65, 92, 0.06);
  }

  .theme-option.active {
    border-color: var(--window-border);
  }

  .theme-swatch {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.15);
    flex-shrink: 0;
  }

  .settings-divider {
    height: 1px;
    background: rgba(38, 65, 92, 0.15);
    margin: 6px 0;
  }

  .text-size-row {
    display: flex;
    gap: 6px;
  }

  .text-size-option {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 0;
    border: 1px solid var(--window-border);
    background: transparent;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
    line-height: 1;
  }

  .text-size-option:hover {
    background: rgba(38, 65, 92, 0.06);
  }

  .text-size-option.active {
    background: var(--window-border);
    color: var(--grid-bg);
  }

  .text-size-option[data-size="normal"] { font-size: 0.7rem; }
  .text-size-option[data-size="large"] { font-size: 0.9rem; }
  .text-size-option[data-size="xlarge"] { font-size: 1.1rem; }

  .controls-bar {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .side-select {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .side-select span {
    font-size: 0.78rem;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .side-btn {
    font-family: inherit;
    font-size: 0.8rem;
    padding: 6px 12px;
    border: 1.5px solid var(--window-border);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    letter-spacing: 0.04em;
  }

  .pause-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
    margin-left: 4px;
  }

  .pause-btn:hover {
    background: rgba(38, 65, 92, 0.08);
  }

  .side-btn.active {
    background: var(--window-border);
    color: var(--grid-bg);
  }

  .scoreboard-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .scoreboard {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 24px;
    border: 1.5px solid var(--window-border);
    background: rgba(38, 65, 92, 0.03);
  }

  .score-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 56px;
  }

  .score-name {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.65;
  }

  .score-value {
    font-size: 1.7rem;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
  }

  .score-sep {
    width: 1px;
    height: 28px;
    background: rgba(38, 65, 92, 0.25);
  }

  .win-note {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.55;
  }

  .game-row {
    display: flex;
    align-items: flex-start;
    gap: 20px;
  }

  .slider-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    /* matches .game-window's rendered height (500px canvas + 6px border
       on each side) so the slider centers against the canvas alone, not
       the taller column below it (footer + control-mode picker) */
    height: 512px;
    order: 0;
  }

  .slider-block .label {
    font-size: 0.7rem;
    opacity: 0.7;
    text-transform: uppercase;
  }

  .vertical-slider {
    writing-mode: vertical-lr;
    direction: rtl;
    appearance: slider-vertical;
    -webkit-appearance: slider-vertical;
    width: 28px;
    height: 420px;
    accent-color: var(--accent);
  }

  .vertical-slider:disabled {
    opacity: 0.32;
    cursor: not-allowed;
  }

  .game-column {
    display: inline-flex;
    flex-direction: column;
    order: 1;
  }

  .game-window {
    position: relative;
    border: 6px solid var(--window-border);
    background: #000;
    line-height: 0;
    -webkit-user-select: none;
    user-select: none;
  }

  .game-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }

  canvas {
    display: block;
    background: #000;
    user-select: none;
  }

  canvas.drag-active {
    cursor: ns-resize;
  }

  .paused-text {
    font-size: 2.1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #fff;
    animation: pulse-size 1.8s ease-in-out infinite;
  }

  @keyframes pulse-size {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }

  .control-mode-section {
    margin-top: 20px;
  }

  .control-mode-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.6;
    text-align: center;
    margin-bottom: 12px;
  }

  .mode-picker {
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  /* Keyboard-sensitivity slider: only meaningful in keyboard control mode, but
     its space is reserved in every mode (min-height) so switching modes doesn't
     shift the canvas. It just fades out when it isn't the active mode. */
  .key-sensitivity {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
    min-height: 26px;
    transition: opacity 0.15s ease;
  }

  .key-sensitivity.inactive {
    opacity: 0;
    visibility: hidden;
  }

  .key-sensitivity-label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.6;
  }

  .key-sensitivity-slider {
    width: 132px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .mode-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 108px;
    padding: 14px 8px 12px;
    border-radius: 16px;
    border: 1.5px solid var(--window-border);
    background: #fff;
    color: var(--ink);
    font-family: inherit;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .mode-card:hover:not(.active) {
    background: rgba(38, 65, 92, 0.06);
  }

  .mode-card.active {
    border-color: var(--accent);
    border-width: 2px;
    transform: scale(1.04);
  }

  .mode-card.active::after {
    content: "";
    position: absolute;
    top: -5px;
    right: -5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }

  .icon-badge {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    border: 1px solid rgba(38, 65, 92, 0.18);
    background-color: rgba(38, 65, 92, 0.04);
    background-image:
      linear-gradient(var(--grid-line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-soft) 1px, transparent 1px);
    background-size: 8px 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }

  .mode-card.active .icon-badge {
    border-color: rgba(47, 111, 176, 0.35);
    background-color: rgba(47, 111, 176, 0.08);
    color: var(--accent);
  }

  .mode-card .mode-label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
  }

  .slider-thumb {
    animation: slide-thumb 2.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes slide-thumb {
    0%, 100% { transform: translateY(-7px); }
    50% { transform: translateY(7px); }
  }

  .drag-cursor {
    animation: bob-cursor 1.8s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes bob-cursor {
    0%, 100% { transform: translateY(-4px); }
    50% { transform: translateY(4px); }
  }

  .key-up {
    animation: press-pulse 2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .key-down {
    animation: press-pulse 2s ease-in-out infinite;
    animation-delay: 1s;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes press-pulse {
    0%, 40%, 100% { opacity: 0.35; }
    15% { opacity: 1; }
  }

  .game-over-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(0, 0, 0, 0.72);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease;
  }

  .game-over-overlay.visible {
    opacity: 1;
    visibility: visible;
  }

  .status-line {
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    text-align: center;
    color: #fff;
  }

  .restart-btn {
    font-family: inherit;
    font-size: 0.8rem;
    padding: 6px 14px;
    border: 1.5px solid #fff;
    background: transparent;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>

<script>
"use strict";
(() => {
  // src/dom.ts
  function byId(id) {
    const el = document.getElementById(id);
    if (!el) throw new Error(`Missing required element #${id}`);
    return el;
  }

  // src/settings.ts
  function initSettings() {
    const settingsTrigger = byId("settingsTrigger");
    const settingsPanel = byId("settingsPanel");
    const themeOptions = document.querySelectorAll(".theme-option");
    const textSizeOptions = document.querySelectorAll(".text-size-option");
    function applyTheme(theme) {
      if (theme === "blue") {
        document.documentElement.removeAttribute("data-theme");
      } else {
        document.documentElement.setAttribute("data-theme", theme);
      }
      themeOptions.forEach(
        (btn) => btn.classList.toggle("active", btn.dataset.theme === theme)
      );
      try {
        localStorage.setItem("pongTheme", theme);
      } catch (e) {
      }
    }
    function applyTextSize(size) {
      if (size === "normal") {
        document.documentElement.removeAttribute("data-text-size");
      } else {
        document.documentElement.setAttribute("data-text-size", size);
      }
      textSizeOptions.forEach(
        (btn) => btn.classList.toggle("active", btn.dataset.size === size)
      );
      try {
        localStorage.setItem("pongTextSize", size);
      } catch (e) {
      }
    }
    settingsTrigger.addEventListener("click", () => {
      document.getElementById("difficultyPanel")?.classList.remove("open");
      settingsPanel.classList.toggle("open");
    });
    themeOptions.forEach((btn) => {
      btn.addEventListener("click", () => {
        applyTheme(btn.dataset.theme);
        settingsPanel.classList.remove("open");
      });
    });
    textSizeOptions.forEach((btn) => {
      btn.addEventListener("click", () => {
        applyTextSize(btn.dataset.size);
        settingsPanel.classList.remove("open");
      });
    });
    document.addEventListener("click", (e) => {
      const target = e.target;
      if (target && !settingsPanel.contains(target) && !settingsTrigger.contains(target)) {
        settingsPanel.classList.remove("open");
      }
    });
    let savedTheme = null;
    let savedTextSize = null;
    try {
      savedTheme = localStorage.getItem("pongTheme");
      savedTextSize = localStorage.getItem("pongTextSize");
    } catch (e) {
    }
    if (savedTheme) applyTheme(savedTheme);
    if (savedTextSize) applyTextSize(savedTextSize);
  }

  // src/constants.ts
  var PADDLE_W = 12;
  var PADDLE_H = 80;
  var PADDLE_MARGIN = 20;
  var BALL_R = 8;
  var WIN_SCORE = 11;
  var BALL_BASE_SPEED = 320;
  var BALL_SPEED_STEP = 18;
  var BALL_MAX_SPEED = 620;
  var KEY_SPEED_NOTCHES = [550, 680, 810, 950, 1080];
  var DEFAULT_KEY_SPEED_NOTCH = 0;
  var DEFAULT_DIFFICULTY = "medium";
  var BOT_TUNING = {
    easy: { maxSpeed: 260, reactionDelayMs: 260, trackingErrorPx: 46 },
    medium: { maxSpeed: 340, reactionDelayMs: 140, trackingErrorPx: 22 },
    hard: { maxSpeed: 430, reactionDelayMs: 60, trackingErrorPx: 8 }
  };
  var BOT_DRIFT_STREAK_SATURATION = 3;
  var BOT_DRIFT_MAX_FRACTION = 0.15;
  var OLLAMA_ENDPOINT = "http://akd-server1:11434";
  var OLLAMA_MODEL = "qwen2.5:3b";
  var LLM_BATCH_RALLIES = 3;
  var LLM_REQUEST_TIMEOUT_MS = 8e3;

  // src/difficulty.ts
  var STORAGE_KEY = "pongDifficulty";
  var VALID = ["easy", "medium", "hard"];
  function isDifficulty(v) {
    return typeof v === "string" && VALID.includes(v);
  }
  function loadDifficulty() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (isDifficulty(raw)) return raw;
    } catch (e) {
    }
    return DEFAULT_DIFFICULTY;
  }
  var difficulty = loadDifficulty();
  function getDifficulty() {
    return difficulty;
  }
  function setDifficulty(next) {
    difficulty = next;
    try {
      localStorage.setItem(STORAGE_KEY, difficulty);
    } catch (e) {
    }
  }

  // src/difficulty-menu.ts
  function initDifficultyMenu() {
    const trigger = byId("difficultyTrigger");
    const panel = byId("difficultyPanel");
    const options = document.querySelectorAll(".difficulty-option");
    function syncActive() {
      const current = getDifficulty();
      options.forEach(
        (btn) => btn.classList.toggle("active", btn.dataset.difficulty === current)
      );
    }
    trigger.addEventListener("click", () => {
      document.getElementById("settingsPanel")?.classList.remove("open");
      panel.classList.toggle("open");
    });
    options.forEach((btn) => {
      btn.addEventListener("click", () => {
        setDifficulty(btn.dataset.difficulty);
        syncActive();
        panel.classList.remove("open");
      });
    });
    document.addEventListener("click", (e) => {
      const target = e.target;
      if (target && !panel.contains(target) && !trigger.contains(target)) {
        panel.classList.remove("open");
      }
    });
    syncActive();
  }

  // src/prefs.ts
  var STORAGE_KEY2 = "pongKeySpeed";
  var MAX_NOTCH = KEY_SPEED_NOTCHES.length - 1;
  function clampNotch(n2) {
    if (!Number.isFinite(n2)) return DEFAULT_KEY_SPEED_NOTCH;
    return Math.max(0, Math.min(MAX_NOTCH, Math.round(n2)));
  }
  function loadNotch() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY2);
      if (raw !== null) return clampNotch(Number(raw));
    } catch (e) {
    }
    return DEFAULT_KEY_SPEED_NOTCH;
  }
  var notch = loadNotch();
  function getKeySpeedNotch() {
    return notch;
  }
  function setKeySpeedNotch(n2) {
    notch = clampNotch(n2);
    try {
      localStorage.setItem(STORAGE_KEY2, String(notch));
    } catch (e) {
    }
  }
  function getKeySpeed() {
    return KEY_SPEED_NOTCHES[notch] ?? KEY_SPEED_NOTCHES[DEFAULT_KEY_SPEED_NOTCH];
  }

  // src/metrics/predictor.ts
  var PREDICTOR_VERSION = 1;
  var MAX_BOUNCES = 32;
  function predict(input) {
    const { ballX, ballVx, ballVy, ballR, height, targetX } = input;
    const top = ballR;
    const bottom = height - ballR;
    const y0 = Math.max(top, Math.min(bottom, input.ballY));
    const result = {
      version: PREDICTOR_VERSION,
      targetX,
      interceptY: null,
      timeToIntercept: null,
      bounces: 0,
      path: [{ x: ballX, y: y0, t: 0, kind: "start" }],
      segments: []
    };
    const dirToTarget = Math.sign(targetX - ballX);
    if (ballVx === 0 || dirToTarget === 0 || Math.sign(ballVx) !== dirToTarget) {
      return result;
    }
    const vx = ballVx;
    let x = ballX;
    let y = y0;
    let vy = ballVy;
    let t = 0;
    let bounces = 0;
    for (let i = 0; i <= MAX_BOUNCES; i += 1) {
      const tToTarget = (targetX - x) / vx;
      let tToWall = Infinity;
      if (vy > 0) tToWall = (bottom - y) / vy;
      else if (vy < 0) tToWall = (top - y) / vy;
      if (tToTarget <= tToWall) {
        t += tToTarget;
        const iy = y + vy * tToTarget;
        result.path.push({ x: targetX, y: iy, t, kind: "intercept" });
        result.interceptY = iy;
        result.timeToIntercept = t;
        break;
      }
      t += tToWall;
      x += vx * tToWall;
      y = vy > 0 ? bottom : top;
      vy = -vy;
      bounces += 1;
      result.path.push({ x, y, t, kind: "wall" });
    }
    result.bounces = bounces;
    result.segments = segmentsFromPath(result.path);
    return result;
  }
  function segmentsFromPath(path) {
    const segments = [];
    for (let i = 0; i + 1 < path.length; i += 1) {
      const a = path[i];
      const b = path[i + 1];
      const dx = b.x - a.x;
      if (dx === 0) continue;
      const slope = (b.y - a.y) / dx;
      segments.push({ fromX: a.x, toX: b.x, slope, intercept: a.y - slope * a.x });
    }
    return segments;
  }
  function formatRule(prediction, maxSegments = 2) {
    if (prediction.segments.length === 0) return "y = —";
    const parts = prediction.segments.slice(0, maxSegments).map((s) => {
      const sign = s.intercept < 0 ? "−" : "+";
      return `y = ${s.slope.toFixed(2)}x ${sign} ${Math.abs(s.intercept).toFixed(0)}`;
    });
    if (prediction.segments.length > maxSegments) parts.push("…");
    return parts.join("  |  ");
  }

  // src/metrics/movement.ts
  var MOVE_TUNING = {
    /** |velocity| below this (px/s) counts as "not moving". */
    idleSpeedPxS: 8,
    /** ignore direction flips from jitter below this |velocity| (px/s). */
    dirDeadbandPxS: 20,
    /** bins for the resting-position histogram (paddle-centre y over a game). */
    restingBins: 8,
    /** EMA factor for the smoothed velocity readout. */
    smoothingAlpha: 1 / 3
  };
  function newMoveAccum() {
    return {
      frames: 0,
      travel: 0,
      idleFrames: 0,
      movingFrames: 0,
      sumMovingSpeed: 0,
      peakSpeed: 0,
      directionChanges: 0,
      lastDirSign: 0,
      sumAbsAccel: 0,
      accelSamples: 0
    };
  }
  function feedMove(a, f) {
    a.frames += 1;
    a.travel += Math.abs(f.dy);
    const speed = Math.abs(f.vy);
    if (speed > a.peakSpeed) a.peakSpeed = speed;
    if (speed < MOVE_TUNING.idleSpeedPxS) {
      a.idleFrames += 1;
    } else {
      a.movingFrames += 1;
      a.sumMovingSpeed += speed;
    }
    const sign = f.vy > MOVE_TUNING.dirDeadbandPxS ? 1 : f.vy < -MOVE_TUNING.dirDeadbandPxS ? -1 : 0;
    if (sign !== 0) {
      if (a.lastDirSign !== 0 && sign !== a.lastDirSign) a.directionChanges += 1;
      a.lastDirSign = sign;
    }
    if (f.accel !== null) {
      a.sumAbsAccel += Math.abs(f.accel);
      a.accelSamples += 1;
    }
  }
  function finalizeMove(a) {
    return {
      travelPx: Math.round(a.travel),
      idleFraction: a.frames ? round3(a.idleFrames / a.frames) : 0,
      directionChanges: a.directionChanges,
      peakSpeedPxS: Math.round(a.peakSpeed),
      meanMovingSpeedPxS: a.movingFrames ? Math.round(a.sumMovingSpeed / a.movingFrames) : 0,
      meanAbsAccelPxS2: a.accelSamples ? Math.round(a.sumAbsAccel / a.accelSamples) : 0
    };
  }
  function finalizeGameMove(a, restingHistogram) {
    return { ...finalizeMove(a), restingHistogram: [...restingHistogram] };
  }
  function round3(n2) {
    return Math.round(n2 * 1e3) / 1e3;
  }

  // src/metrics/reaction.ts
  var REACTION_TUNING = {
    /** Paddle within this of the predicted intercept at the stimulus => no
     *  reaction needed. Roughly half a paddle height. */
    positionedTolerancePx: 40,
    /** |paddle velocity| above this (px/s) counts as a deliberate move. */
    responseSpeedPxS: 30,
    /** Ignore "moving toward the intercept" when the paddle is basically there. */
    minGapPx: 6
  };
  function summarizeReactions(all) {
    const legs = all.filter((r) => r !== null);
    const needed = legs.filter((r) => r.needed);
    const derived = needed.map((r) => r.derivedMs).filter((v) => v !== null);
    const inputs = needed.map((r) => r.inputMs).filter((v) => v !== null);
    return {

      const effReactionDelayMs = tuning.reactionDelayMs * (1 - botState.driftFraction);
      const effTrackingErrorPx = tuning.trackingErrorPx * (1 - botState.driftFraction);

        maxSpeed: effMaxSpeed,
        reactionDelayMs: effReactionDelayMs,

          label: "peak speed",
          help: "Fastest the paddle moved this leg.",
          get: (s) => s.currentLegMovement ? `${n(s.currentLegMovement.peakSpeedPxS)} px/s` : "—"
        },
        {
          label: "mean speed",
          help: "Average paddle speed while actually moving.",
          get: (s) => s.currentLegMovement ? `${n(s.currentLegMovement.meanMovingSpeedPxS)} px/s` : "—"
        }
      ]
    }
  ];
  var STYLE = `
#pong-debug-panel{position:fixed;bottom:14px;left:14px;z-index:9999;width:252px;
  max-height:calc(100vh - 28px);overflow:auto;
  font:11px/1.5 "Courier New",Consolas,monospace;color:#1c2e40;
  background:rgba(255,255,255,0.95);border:1px solid #26415c;
  box-shadow:0 2px 12px rgba(0,0,0,0.14);padding-bottom:6px}
#pong-debug-panel .p-hdr{display:flex;justify-content:space-between;align-items:baseline;
  padding:5px 10px;border-bottom:1px solid rgba(38,65,92,0.22);
  background:rgba(38,65,92,0.05);font-weight:700;letter-spacing:0.03em}
#pong-debug-panel .p-hdr button{font:inherit;font-weight:700;border:1px solid #26415c;
  background:transparent;color:inherit;cursor:pointer;padding:0 5px;line-height:1.3;border-radius:3px}
#pong-debug-panel .p-sec{padding:0 10px;margin-top:7px;font-size:9px;letter-spacing:0.09em;
  text-transform:uppercase;opacity:0.55}
#pong-debug-panel .p-row{display:flex;justify-content:space-between;gap:10px;padding:0 10px}
#pong-debug-panel .p-row .l{opacity:0.6;white-space:nowrap}
#pong-debug-panel .p-row .v{text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#pong-debug-panel .p-help{display:none;padding:1px 10px 4px;font-size:9px;line-height:1.35;
  opacity:0.5;font-style:italic}
#pong-debug-panel.show-help .p-help{display:block}
`;
  function initDebugPanel(getBotDebugInfo) {
    if (document.getElementById("pong-debug-panel")) return;
    const style = document.createElement("style");
    style.textContent = STYLE;
    document.head.appendChild(style);
    const panel = document.createElement("div");
    panel.id = "pong-debug-panel";
    const header = document.createElement("div");
    header.className = "p-hdr";
    const title = document.createElement("span");
    title.textContent = "pong metrics";
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.textContent = "?";
    toggle.title = "Show / hide what each row measures";
    toggle.addEventListener("click", () => panel.classList.toggle("show-help"));
    header.append(title, toggle);
    panel.appendChild(header);
    const valueCells = [];
    for (const section of SECTIONS) {
      const st = document.createElement("div");
      st.className = "p-sec";
      st.textContent = section.title;
      panel.appendChild(st);
      const sh = document.createElement("div");
      sh.className = "p-help";
      sh.textContent = section.help;
      panel.appendChild(sh);
      for (const row of section.rows) {
        const r = document.createElement("div");
        r.className = "p-row";
        r.title = row.help;
        const l = document.createElement("span");
        l.className = "l";
        l.textContent = row.label;
        const v = document.createElement("span");
        v.className = "v";
        r.append(l, v);
        panel.appendChild(r);
        const rh = document.createElement("div");
        rh.className = "p-help";
        rh.textContent = row.help;
        panel.appendChild(rh);
        valueCells.push({ cell: v, get: row.get });
      }
    }
    document.body.appendChild(panel);
    function render() {
      const s = getSnapshot();
      latestBotInfo = getBotDebugInfo();
      for (const { cell, get } of valueCells) cell.textContent = get(s);
    }
    render();
    window.setInterval(render, REFRESH_MS);
  }

  // src/main.ts
  var debug = window.location.hash.toLowerCase().includes("debug");
  initSettings();
  initDifficultyMenu();
  var gameApi = initGame({ debug });
  if (debug) {
    initDebugPanel(gameApi.getBotDebugInfo);
  }
  globalThis.__pongMetrics = {
    getFrames,
    getSnapshot,
    getCurrentGame,
    getSavedGames,
    dump,
    downloadJSON() {
      const blob = new Blob([JSON.stringify(dump(), null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `pong-metrics-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }
  };
})();
</script>
</body>
</html>
